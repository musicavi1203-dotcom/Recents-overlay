name: convert-framework

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download dex2jar
        run: |
          curl -L -o dex2jar.zip https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
          unzip -q dex2jar.zip
          chmod +x dex-tools-v2.4/*.sh

      - name: Rebuild framework.jar and convert to class jars
        run: |
          mkdir -p out
          cat libs/fw_part1.bin libs/fw_part2.bin > libs/framework.jar
          ./dex-tools-v2.4/d2j-dex2jar.sh -f -o out/framework-classes.jar libs/framework.jar
          ./dex-tools-v2.4/d2j-dex2jar.sh -f -o out/systemui-classes.jar libs/MtkSystemUI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: framework-classes
          path: out/*.jar
