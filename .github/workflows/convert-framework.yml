name: convert-framework

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install enjarify
        run: pip install enjarify

      - name: Rebuild framework.jar and convert to class jars
        run: |
          mkdir -p out
          cat libs/fw_part1.bin libs/fw_part2.bin > libs/framework.jar
          enjarify -o out/framework-classes.jar libs/framework.jar
          enjarify -o out/systemui-classes.jar libs/MtkSystemUI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: framework-classes
          path: out/*.jar
